<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TL_TITLE__ · traffic-lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0b0b0d; --surface: #111114; --panel: #131316; --card: #16161a; --raised: #1c1c21;
  --border: #26262c; --border-strong: #34343c;
  --text: #ececf1; --muted: #9a9aa5; --faint: #6b6b76;
  --edge: #5c5f6b; --edge-hi: #e4e4e7; --grid: #1a1a1f;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --low: #60a5fa;
  --k-client: #2dd4bf; --k-gateway: #fb923c; --k-auth: #f472b6; --k-service: #4ade80;
  --k-function: #22d3ee; --k-worker: #a3e635; --k-queue: #c084fc; --k-cache: #f87171;
  --k-database: #818cf8; --k-search: #38bdf8; --k-storage: #facc15; --k-external: #a1a1aa;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --sans: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f6f7; --surface: #ffffff; --panel: #ffffff; --card: #ffffff; --raised: #f3f3f5;
  --border: #e4e4e8; --border-strong: #d4d4d8;
  --text: #18181b; --muted: #62626d; --faint: #9a9aa5;
  --edge: #a1a1aa; --edge-hi: #27272a; --grid: #ececef;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --low: #2563eb;
  --k-client: #0d9488; --k-gateway: #ea580c; --k-auth: #db2777; --k-service: #16a34a;
  --k-function: #0891b2; --k-worker: #65a30d; --k-queue: #9333ea; --k-cache: #dc2626;
  --k-database: #4f46e5; --k-search: #0284c7; --k-storage: #ca8a04; --k-external: #71717a;
  --shadow: 0 10px 30px rgba(20,20,30,.12);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }

/* ---------- header ---------- */
.page { max-width: 1680px; margin: 0 auto; padding: 18px 24px 24px; }
.crumbs { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.crumbs b { color: var(--text); font-weight: 500; }
.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.title-icon { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--muted); }
h1 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 700; letter-spacing: -.02em; }
.badge { border: 1px solid var(--border-strong); border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 500; }
.meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.sources { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.src-chip { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; }
.src-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); display: inline-block; }
.tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--border); margin: 18px 0 14px; }
.tab { background: none; border: 0; padding: 0 0 10px; cursor: pointer; color: var(--muted); font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 7px; align-items: center; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.tab .count { font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--raised); color: var(--muted); line-height: 18px; }
.tab .count.hot { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; height: calc(100vh - 168px); min-height: 560px; }
.canvas-wrap, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
.canvas-wrap { position: relative; overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; background-color: var(--surface); }
.canvas-wrap.panning { cursor: grabbing; }
.panel { overflow-y: auto; padding: 22px 22px 28px; }
@media (max-width: 1020px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .canvas-wrap { height: 72vh; min-height: 460px; }
  .sources { margin-left: 0; }
}
@media (max-width: 560px) {
  .page { padding: 12px 16px 16px; }
  h1 { font-size: 22px; }
  .tabs { gap: 18px; }
}

/* ---------- toolbar ---------- */
.toolbar { position: absolute; top: 16px; left: 16px; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 5px; border: 1px solid var(--border); border-radius: 14px; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(8px); box-shadow: var(--shadow); cursor: default; }
.tb { width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; position: relative; }
.tb:hover { background: var(--raised); color: var(--text); }
.tb.on { background: var(--raised); color: var(--text); }
.tb[disabled] { opacity: .35; pointer-events: none; }
.tb.txt { width: auto; padding: 0 9px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tb-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.tb svg { width: 18px; height: 18px; }
.search-box { display: none; align-items: center; }
.search-box.open { display: flex; }
.search-box input { width: 210px; height: 32px; border: 1px solid var(--border); border-radius: 9px; background: var(--card); color: var(--text); padding: 0 10px; font: 13px var(--sans); outline: none; }
.search-box input:focus { border-color: var(--border-strong); }
.search-count { font-size: 11.5px; color: var(--muted); margin: 0 6px; min-width: 32px; }
.popover { position: absolute; top: 58px; left: 16px; z-index: 6; width: 290px; max-height: calc(100% - 80px); overflow: auto; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); display: none; cursor: default; }
.popover.open { display: block; }
.popover h4 { margin: 4px 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; }
.check { display: flex; align-items: center; gap: 9px; padding: 5px 4px; border-radius: 7px; cursor: pointer; font-size: 13px; user-select: none; }
.check:hover { background: var(--raised); }
.check input { accent-color: var(--text); margin: 0; }
.check .n { margin-left: auto; color: var(--faint); font-size: 12px; }
.zoombar { position: absolute; right: 16px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 4px; border: 1px solid var(--border); border-radius: 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); cursor: default; }
.zoombar .tb { width: 30px; height: 30px; }
.zoombar .pct { font-size: 12px; color: var(--muted); width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.hint { position: absolute; left: 18px; bottom: 16px; font-size: 11.5px; color: var(--faint); z-index: 4; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; z-index: 3; pointer-events: none; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px; }

/* ---------- world ---------- */
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world.animate { transition: transform .38s cubic-bezier(.2,.7,.2,1); }
.world > svg { position: absolute; left: 0; top: 0; overflow: visible; }
.group { position: absolute; border: 1px solid var(--border); border-radius: 16px; background: color-mix(in srgb, var(--card) 55%, transparent); pointer-events: none; transition: opacity .15s; }
.group > span { position: absolute; top: 10px; left: 16px; font-size: 11px; color: var(--muted); font-weight: 500; }
.group.dim { opacity: .35; }

.node { position: absolute; display: flex; align-items: center; gap: 11px; padding: 0 12px; border-radius: 11px; cursor: pointer;
  background: color-mix(in srgb, var(--k) 8%, var(--card)); border: 1px solid color-mix(in srgb, var(--k) 30%, var(--border));
  transition: opacity .15s, box-shadow .15s, border-color .15s; user-select: none; }
.node:hover { border-color: color-mix(in srgb, var(--k) 60%, var(--border)); }
.node.selected { box-shadow: 0 0 0 1.5px var(--k), 0 0 24px color-mix(in srgb, var(--k) 30%, transparent); }
.node.match { box-shadow: 0 0 0 2px var(--warn); }
.node.discovered { border-style: dashed; }
.node.dim { opacity: .25; }
.node .ic { width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; color: var(--k); background: color-mix(in srgb, var(--k) 16%, transparent); }
.node .ic svg { width: 15px; height: 15px; }
.node .tx { min-width: 0; flex: 1; }
.node .nl { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .ns { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .nm { display: flex; align-items: center; gap: 6px; flex: none; }
.node .vol { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }
.node .fdot { width: 7px; height: 7px; border-radius: 50%; }

.edge { transition: opacity .15s; }
.edge .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; pointer-events: stroke; }
.edge .line { fill: none; stroke: var(--ec); stroke-width: var(--w); stroke-linejoin: round; }
.edge .arrow, .edge .port-end { fill: var(--ec); }
.edge .port { fill: var(--surface); stroke: var(--ec); stroke-width: 1.2; }
.edge.async .line { stroke-dasharray: 5 4; }
.edge.traffic-only .line { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
.edge.unobserved { opacity: .42; }
.edge.inferred .line { opacity: .75; }
.edge.focus { opacity: 1; }
.edge.focus:not(.health) .line { stroke: var(--edge-hi); }
.edge.focus:not(.health) .arrow, .edge.focus:not(.health) .port-end { fill: var(--edge-hi); }
.edge.focus:not(.health) .port { stroke: var(--edge-hi); }
.edge.focus .line { stroke-width: calc(var(--w) + .8px); }
.edge.dim { opacity: .08; }
.edge .pt { fill: var(--pc); pointer-events: none; }
.edge.dim .pt { opacity: 0; }

.tooltip { position: absolute; z-index: 8; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; font-size: 12px; box-shadow: var(--shadow); max-width: 320px; display: none; }
.tooltip b { font-weight: 600; }
.tooltip .sub { color: var(--muted); margin-top: 2px; }

/* ---------- panel ---------- */
.eyebrow { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.panel h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; word-break: break-word; }
.panel h2 a { color: inherit; text-decoration: none; cursor: pointer; }
.panel h2 a:hover { text-decoration: underline; text-underline-offset: 3px; }
.panel h2 .arrow { color: var(--faint); font-weight: 400; }
.panel h3 { font-size: 15px; margin: 26px 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.panel h3 .n { color: var(--faint); font-weight: 400; font-size: 13px; }
.panel .sub { color: var(--muted); margin-top: 6px; }
.back { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; margin-bottom: 14px; }
.back:hover { color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); }
.chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--border)); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 8px; margin-top: 16px; }
.stat { border: 1px solid var(--border); border-radius: 11px; padding: 9px 11px; background: var(--card); }
.stat .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11.5px; color: var(--muted); }
.legend-row { display: flex; align-items: center; gap: 11px; padding: 6px 6px; margin: 0 -6px; border-radius: 8px; cursor: pointer; font-size: 15px; user-select: none; }
.legend-row:hover { background: var(--raised); }
.legend-row.off { opacity: .38; }
.legend-row.off .name { text-decoration: line-through; }
.legend-row .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--k); }
.legend-row .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.line-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; font-size: 14px; }
.line-row svg { width: 26px; height: 10px; flex: none; }
.line-row .desc { color: var(--faint); font-size: 12px; margin-left: auto; }
.hint-text { color: var(--muted); font-size: 13.5px; margin-top: 26px; line-height: 1.6; }
kbd { font: 11.5px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; margin-top: 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.list { display: flex; flex-direction: column; gap: 6px; }
.row { border: 1px solid var(--border); border-radius: 11px; padding: 9px 11px; background: var(--card); cursor: pointer; transition: border-color .12s; }
.row:hover { border-color: var(--border-strong); }
.row.static { cursor: default; }
.row.active { border-color: var(--text); }
.row-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row-top .path { font: 12.5px var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-top .r { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .meta2 { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.row .locs { margin-top: 6px; font: 11.5px var(--mono); color: var(--faint); word-break: break-all; }
.m { font: 600 10.5px var(--mono); padding: 1px 6px; border-radius: 5px; flex: none; color: var(--mc); background: color-mix(in srgb, var(--mc) 15%, transparent); }
.kdot { width: 8px; height: 8px; border-radius: 50%; background: var(--k); flex: none; }
.sev { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 5px; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, transparent); flex: none; }
.finding .ttl { font-size: 13.5px; font-weight: 600; margin-top: 6px; }
.finding .det { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.finding ul { margin: 6px 0 0; padding-left: 16px; font: 11.5px var(--mono); color: var(--muted); }
.finding li { margin: 2px 0; word-break: break-word; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 12px; }
.fbtn { border: 1px solid var(--border); background: none; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.fbtn.on { color: var(--text); border-color: var(--text); }
.steps { counter-reset: s; margin-top: 10px; }
.step { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; cursor: pointer; }
.step::before { counter-increment: s; content: counter(s); width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center; font-size: 11px; color: var(--muted); flex: none; }
.step:hover { color: var(--text); }
.step .arrow { color: var(--faint); }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); border-left: 2px solid var(--border-strong); padding-left: 10px; margin: 8px 0; }

/* ---------- live ---------- */
.src-chip.live { color: var(--text); border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); }
.src-chip.live i { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.edge.pulse .line { animation: pulse 1.4s ease-out; }
@keyframes pulse { 0% { stroke-width: calc(var(--w) + 5px); filter: drop-shadow(0 0 6px var(--ec)); } 100% { stroke-width: var(--w); } }

/* ---------- diff ---------- */
.node[data-diff]::after { position: absolute; top: -8px; right: 10px; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 5px; background: var(--surface); border: 1px solid currentColor; }
.node.d-added { box-shadow: 0 0 0 1.5px var(--ok), 0 0 20px color-mix(in srgb, var(--ok) 30%, transparent); }
.node.d-added::after { content: 'new'; color: var(--ok); }
.node.d-removed { opacity: .5; border-style: dashed; border-color: var(--bad); }
.node.d-removed::after { content: 'removed'; color: var(--bad); }
.edge.d-removed .line { stroke-dasharray: 4 4; opacity: .7; }

/* ---------- blast radius ---------- */
.node.blast-origin { box-shadow: 0 0 0 2px var(--bad), 0 0 26px color-mix(in srgb, var(--bad) 45%, transparent); }
.node.blast-hit { box-shadow: 0 0 0 1.5px var(--warn); }
.edge.hot .line { stroke: var(--warn) !important; stroke-width: calc(var(--w) + 2px); }
.action { border: 1px solid var(--border-strong); background: var(--card); border-radius: 9px; padding: 6px 11px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.action:hover { border-color: var(--text); }
.action.on { border-color: var(--bad); color: var(--bad); }

/* ---------- waterfall ---------- */
.samples { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 8px; }
.wf { margin-top: 6px; }
.wf-axis { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--faint); margin-left: 0; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.wf-row { padding: 5px 0 5px calc(var(--d) * 10px); border-bottom: 1px dashed var(--border); cursor: pointer; }
.wf-row:hover { background: var(--raised); }
.wf-label { display: flex; gap: 6px; align-items: baseline; font-size: 11.5px; min-width: 0; }
.wf-label .who { white-space: nowrap; }
.wf-label .what { font: 10.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.wf-track { position: relative; height: 8px; margin-top: 4px; background: color-mix(in srgb, var(--border) 45%, transparent); border-radius: 3px; }
.wf-bar { position: absolute; top: 0; height: 8px; min-width: 2px; border-radius: 3px; background: var(--low); }
.wf-bar.async { background: repeating-linear-gradient(90deg, var(--k-queue) 0 4px, transparent 4px 6px); }
.wf-bar.err { background: var(--bad); }
.wf-bar.warn { background: var(--warn); }
.wf-label .ms { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); white-space: nowrap; }
</style>
</head>
<body>
<div class="page">
  <div class="crumbs">traffic-lens › <b>Traffic map</b></div>
  <div class="title-row">
    <span class="title-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg></span>
    <h1 id="title"></h1>
    <span class="badge" id="badge">Traffic</span>
    <span class="meta" id="meta"></span>
    <div class="sources" id="sources"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="flows">Flows <span class="count" id="flow-count">0</span></button>
    <button class="tab" data-tab="findings">Findings <span class="count" id="finding-count">0</span></button>
  </nav>
  <div class="layout">
    <section class="canvas-wrap" id="canvas">
      <div class="toolbar" id="toolbar">
        <button class="tb" id="tb-search" title="Search (/)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <div class="search-box" id="search-box"><input id="search" placeholder="Search services, routes…" autocomplete="off"><span class="search-count" id="search-count"></span></div>
        <button class="tb" id="tb-filter" title="Filter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5z"/></svg></button>

<script id="tl-data" type="application/json">__TL_DATA__</script>
<!--__TL_ELK__-->
<script>
(() => {
'use strict';
function normalize(d) {
  d.nodes = d.nodes || []; d.edges = d.edges || []; d.groups = d.groups || [];
  d.flows = d.flows || []; d.findings = d.findings || []; d.meta = d.meta || {};
  return d;
}
// replaced wholesale on live updates (serve.mjs)
let DATA = normalize(JSON.parse(document.getElementById('tl-data').textContent));

// ---------- constants ----------
const KIND_ORDER = ['client','gateway','auth','service','function','worker','queue','cache','database','search','storage','external'];
const KIND_LABEL = { client:'Client', gateway:'Gateway', auth:'Security', service:'Service', function:'Function', worker:'Worker', queue:'Queue', cache:'Cache', database:'Database', search:'Search', storage:'Storage', external:'External' };
const I = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS = {
  client: I('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
  gateway: I('<circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v4m0 0-6 6m6-6 6 6"/>'),
  auth: I('<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="m9 12 2 2 4-4"/>'),
  service: I('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>'),
  function: I('<path d="M5 20 11 9M8 4h3l8 16"/>'),
  worker: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>'),
  queue: I('<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'),
  cache: I('<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>'),
  database: I('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
  search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  storage: I('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>'),
  external: I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'),
};
const PLAY = I('<path d="M7 5v14l11-7z"/>');
const PAUSE = I('<path d="M8 5v14M16 5v14"/>');
const PROTO_LABEL = { http:'HTTP', graphql:'GraphQL', grpc:'gRPC', websocket:'WebSocket', sse:'SSE', sql:'SQL', nosql:'NoSQL', redis:'Redis', queue:'Queue', kafka:'Kafka', amqp:'AMQP', sqs:'SQS', pubsub:'Pub/Sub', s3:'S3', smtp:'SMTP', tcp:'TCP', other:'Other' };
const METHOD_COLOR = { GET:'var(--ok)', POST:'var(--low)', PUT:'var(--warn)', PATCH:'var(--warn)', DELETE:'var(--bad)' };
const SEV_COLOR = { high:'var(--bad)', medium:'var(--warn)', low:'var(--low)', info:'var(--faint)' };
const SEV_RANK = { high:0, medium:1, low:2, info:3 };
const NODE_W = 232, NODE_H = 56;
let hasTraffic, hasCode, isDiff, isLive;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- indices ----------
let nodeById, edgeById, flowById, findingById, inEdges, outEdges, hotFindings;
function indexData() {
  hasTraffic = DATA.edges.some(e => e.stats);
  hasCode = (DATA.meta.sources || []).includes('code');
  isDiff = Boolean(DATA.meta.diff);
  isLive = Boolean(DATA.meta.live) && location.protocol.startsWith('http');
  nodeById = new Map(DATA.nodes.map(n => [n.id, n]));
  edgeById = new Map(DATA.edges.map(e => [e.id, e]));
  flowById = new Map(DATA.flows.map(f => [f.id, f]));
  findingById = new Map(DATA.findings.map(f => [f.id, f]));
  inEdges = new Map(DATA.nodes.map(n => [n.id, []]));
  outEdges = new Map(DATA.nodes.map(n => [n.id, []]));
  for (const e of DATA.edges) { inEdges.get(e.target)?.push(e); outEdges.get(e.source)?.push(e); }
  hotFindings = DATA.findings.filter(f => f.severity === 'high' && f.diff !== 'resolved').length;
}
indexData();
const findingsFor = (type, id) => DATA.findings.filter(f => (type === 'node' ? f.nodes : f.edges).includes(id));
const worstSeverity = (list) => list.reduce((w, f) => (w == null || SEV_RANK[f.severity] < SEV_RANK[w] ? f.severity : w), null);

// ---------- state ----------
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const state = {
  tab: 'overview', sel: null, hover: null, flow: null, finding: null,
  hiddenKinds: new Set(), hiddenProtocols: new Set(), hideUnobserved: false,
  playing: !reducedMotion, speed: 1, health: hasTraffic,
  view: { x: 0, y: 0, k: 1 }, search: '', matches: [], matchIdx: -1,
  findingFilter: 'all', layout: null,
  blast: null, sample: 0, wfEdge: null,
};

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmt = (n) => n == null ? '–' : n >= 1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'') + 'M' : n >= 1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'') + 'k' : String(n);
const pct = (r) => r == null ? '–' : (r * 100 < 10 ? (r * 100).toFixed(1) : Math.round(r * 100)) + '%';
const ms = (v) => v == null ? '–' : v >= 1000 ? (v/1000).toFixed(1) + 's' : Math.round(v) + 'ms';
const kindVar = (k) => `var(--k-${KIND_ORDER.includes(k) ? k : 'service'})`;
const label = (id) => nodeById.get(id)?.label ?? id;
const healthColor = (r) => r >= 0.05 ? 'var(--bad)' : r >= 0.01 ? 'var(--warn)' : 'var(--ok)';
const methodChip = (m) => m ? `<span class="m" style="--mc:${METHOD_COLOR[m] || 'var(--muted)'}">${esc(m)}</span>` : '';
const callText = (c) => `${c.path || ''}${c.operation ? ` · ${c.operation}` : ''}` || '—';
const observedChip = (o) => !hasTraffic || !hasCode || !o ? '' : o === 'both' ? '<span class="chip ok">seen in traffic</span>' : o === 'traffic' ? '<span class="chip warn">traffic only</span>' : '<span class="chip">not observed</span>';
function routeMatch(a, b) {
  const A = String(a || '').split('/'), B = String(b || '').split('/');
  for (let i = 0; i < A.length; i++) {
    if (A[i] === '*' || /^:.*\*$/.test(A[i])) return true;
    if (i >= B.length) return false;
    if (A[i].startsWith(':') || B[i].startsWith(':')) continue;
    if (A[i].toLowerCase() !== B[i].toLowerCase()) return false;
  }
  return A.length === B.length;
}
const methodOk = (a, b) => { const x = (a || '').toUpperCase(), y = (b || '').toUpperCase(); return !x || !y || x === 'ANY' || y === 'ANY' || x === '*' || y === '*' || x === y; };
function nodeVolume(id) { let s = 0, any = false; for (const e of inEdges.get(id) || []) if (e.stats) { s += e.stats.count; any = true; } return any ? s : null; }
const DIFF_COLOR = { added: 'var(--ok)', removed: 'var(--bad)', changed: 'var(--warn)', new: 'var(--bad)', resolved: 'var(--ok)' };
const diffChip = (d) => d ? `<span class="chip" style="color:${DIFF_COLOR[d]};border-color:color-mix(in srgb, ${DIFF_COLOR[d]} 40%, var(--border))">${d}</span>` : '';

// Everything that breaks if `id` goes down: its callers, their callers, and so on.
// Async edges don't propagate — a producer keeps working while its consumer is down.
function blastRadius(id) {
  const nodes = new Set([id]);
  const edges = new Set();
  const queue = [id];
  while (queue.length) {
    const cur = queue.shift();
    for (const e of inEdges.get(cur) || []) {
      if (e.diff === 'removed' || e.async) continue;
      edges.add(e.id);
      if (!nodes.has(e.source)) { nodes.add(e.source); queue.push(e.source); }
    }
  }
  const flows = DATA.flows.filter(f => f.steps.some(s => { const e = edgeById.get(s); return e && (e.source === id || e.target === id); }));
  return { nodes, edges, flows };
}

// ---------- header ----------
const SRC_LABEL = { code: 'Code scan', har: 'HAR capture', otel: 'OpenTelemetry' };
function renderHeader() {
  document.title = (DATA.title || 'Traffic map') + ' · traffic-lens';
  $('title').textContent = DATA.title || 'Traffic map';
  $('badge').textContent = isDiff ? 'Diff' : 'Traffic';
  $('meta').textContent = isDiff
    ? `${DATA.meta.diff.base.label} → ${DATA.meta.diff.head.label} · ${DATA.meta.diff.summary.total} changes`
    : `${DATA.nodes.length} nodes · ${DATA.edges.length} connections` + (hasTraffic ? ` · ${fmt(DATA.meta.requests)} requests` : '');
  const live = isLive ? `<span class="src-chip live" title="Updates as traffic arrives"><i></i>Live · ${new Date(DATA.meta.generatedAt).toLocaleTimeString()}</span>` : '';
  $('sources').innerHTML = live + (DATA.meta.sources || []).map(s => `<span class="src-chip"><i></i>${esc(SRC_LABEL[s] || s)}</span>`).join('');
  $('flow-count').textContent = DATA.flows.length;
  const fc = $('finding-count');
  fc.textContent = DATA.findings.filter(f => f.diff !== 'resolved').length;
  fc.classList.toggle('hot', hotFindings > 0);
  $('tb-health').disabled = !hasTraffic;
  let changesTab = document.querySelector('.tab[data-tab="changes"]');
  if (isDiff && !changesTab) {
    $('tabs').insertAdjacentHTML('afterbegin', '<button class="tab" data-tab="changes">Changes <span class="count" id="change-count"></span></button>');
    changesTab = document.querySelector('.tab[data-tab="changes"]');
    changesTab.onclick = () => setTab('changes');
  }
  if (changesTab) $('change-count').textContent = DATA.meta.diff.summary.total;
}
renderHeader();

// ---------- theme ----------
function applyTheme(t) { document.documentElement.dataset.theme = t; store.set('tl-theme', t); }
applyTheme(store.get('tl-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('tb-theme').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

// ---------- layout ----------
const elk = typeof ELK !== 'undefined' ? new ELK() : null;

function visibleSets() {
  const nodes = DATA.nodes.filter(n => !state.hiddenKinds.has(n.kind));
  const ids = new Set(nodes.map(n => n.id));
  const edges = DATA.edges.filter(e => ids.has(e.source) && ids.has(e.target)
    && !state.hiddenProtocols.has(e.protocol)
    && !(state.hideUnobserved && hasTraffic && e.observed === 'code'));
  return { nodes, edges };
}

async function computeLayout() {
  const { nodes, edges } = visibleSets();
  const rank = (n) => KIND_ORDER.indexOf(n.kind);
  const sorted = nodes.slice().sort((a, b) => rank(a) - rank(b) || a.label.localeCompare(b.label));
  const hasIncoming = new Set(edges.map(e => e.target));
  const toElk = (n) => ({
    id: n.id, width: NODE_W, height: NODE_H,
    layoutOptions: n.kind === 'client' && !hasIncoming.has(n.id) && !n.group ? { 'elk.layered.layering.layerConstraint': 'FIRST' } : {},
  });
  const children = sorted.filter(n => !n.group).map(toElk);
  for (const g of DATA.groups) {
    const members = sorted.filter(n => n.group === g.id);
    if (!members.length) continue;
    children.push({ id: '__group__' + g.id, layoutOptions: { 'elk.padding': '[top=34,left=18,bottom=18,right=18]' }, children: members.map(toElk) });
  }
  const graph = {
    id: 'root',
    layoutOptions: {
      'elk.algorithm': 'layered', 'elk.direction': 'DOWN', 'elk.edgeRouting': 'ORTHOGONAL',
      'elk.hierarchyHandling': 'INCLUDE_CHILDREN', 'elk.json.edgeCoords': 'ROOT', 'elk.json.shapeCoords': 'ROOT',
      'elk.spacing.nodeNode': '36', 'elk.layered.spacing.nodeNodeBetweenLayers': '70',
      'elk.spacing.edgeNode': '22', 'elk.spacing.edgeEdge': '12',
      'elk.layered.spacing.edgeNodeBetweenLayers': '26', 'elk.layered.spacing.edgeEdgeBetweenLayers': '12',
      'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF', 'elk.layered.nodePlacement.bk.fixedAlignment': 'BALANCED',
      'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES',
      'elk.padding': '[top=90,left=40,bottom=60,right=40]',
    },
    children,
    edges: edges.map(e => ({ id: e.id, sources: [e.source], targets: [e.target] })),
  };
  const res = await elk.layout(graph);
  const pos = new Map(), groups = [], routes = new Map();
  const walk = (list) => {
    for (const c of list || []) {
      if (c.id.startsWith('__group__')) { groups.push({ id: c.id.slice(9), x: c.x, y: c.y, w: c.width, h: c.height }); walk(c.children); }
      else pos.set(c.id, { x: c.x, y: c.y, w: c.width, h: c.height });
    }
  };
  walk(res.children);
  const collect = (container) => {
    for (const e of container.edges || []) {
      const s = (e.sections || [])[0];
      if (s) routes.set(e.id, [s.startPoint, ...(s.bendPoints || []), s.endPoint]);
    }
    for (const c of container.children || []) collect(c);
  };
  collect(res);
  return { nodes, edges, pos, groups, routes, width: res.width, height: res.height };
}

// ---------- drawing ----------
function roundedPath(pts, r = 6) {
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    const d1 = Math.hypot(p1.x - p0.x, p1.y - p0.y), d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    if (!d1 || !d2 || rr <= 0) { d += ` L${p1.x},${p1.y}`; continue; }
    const a = { x: p1.x + (p0.x - p1.x) * rr / d1, y: p1.y + (p0.y - p1.y) * rr / d1 };
    const b = { x: p1.x + (p2.x - p1.x) * rr / d2, y: p1.y + (p2.y - p1.y) * rr / d2 };
    d += ` L${a.x},${a.y} Q${p1.x},${p1.y} ${b.x},${b.y}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last.x},${last.y}`;
}

function arrowHead(pts) {
  const p = pts[pts.length - 1], q = pts[pts.length - 2] || { x: p.x, y: p.y - 1 };
  const len = Math.hypot(p.x - q.x, p.y - q.y) || 1;
  const ux = (p.x - q.x) / len, uy = (p.y - q.y) / len, s = 4.5;
  return `M${p.x},${p.y} L${p.x - ux * s * 1.4 - uy * s},${p.y - uy * s * 1.4 + ux * s} L${p.x - ux * s * 1.4 + uy * s},${p.y - uy * s * 1.4 - ux * s} Z`;
}

const SVGNS = 'http://www.w3.org/2000/svg';
let particles = [];

function edgeStyle(e) {
  if (isDiff && e.diff) return { color: DIFF_COLOR[e.diff], w: e.diff === 'removed' ? 1.3 : 2, health: false };
  const health = state.health && e.stats;
  const color = health ? healthColor(e.stats.error_rate) : 'var(--edge)';
  const w = e.stats ? 1.3 + Math.min(2.6, Math.log10(e.stats.count + 1) * 0.8) : 1.3;
  return { color, w, health };
}

function draw() {
  const L = state.layout;
  const gEdges = $('g-edges'), gNodes = $('g-nodes'), gGroups = $('g-groups');
  gEdges.innerHTML = ''; gNodes.innerHTML = ''; gGroups.innerHTML = '';
  particles = [];
  const svg = $('svg');
  svg.setAttribute('width', L.width); svg.setAttribute('height', L.height);

  for (const g of L.groups) {
    const meta = DATA.groups.find(x => x.id === g.id) || {};
    const el = document.createElement('div');
    el.className = 'group'; el.dataset.id = g.id;
    Object.assign(el.style, { left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px' });
    el.innerHTML = `<span>${esc(meta.label || g.id)}</span>`;
    gGroups.appendChild(el);
  }

  for (const e of L.edges) {
    const pts = L.routes.get(e.id);
    if (!pts || pts.length < 2) continue;
    const st = edgeStyle(e);
    const g = document.createElementNS(SVGNS, 'g');
    g.classList.add('edge');
    if (e.async) g.classList.add('async');
    if (hasCode && e.observed === 'traffic') g.classList.add('traffic-only');
    if (hasTraffic && hasCode && e.observed === 'code') g.classList.add('unobserved');
    if (e.confidence === 'inferred') g.classList.add('inferred');
    if (st.health) g.classList.add('health');
    if (isDiff && e.diff) g.classList.add('health', 'd-' + e.diff); // keep the diff colour when focused
    g.dataset.id = e.id;
    g.style.setProperty('--ec', st.color);
    g.style.setProperty('--w', st.w + 'px');
    g.style.setProperty('--pc', st.health ? st.color : kindVar(nodeById.get(e.source)?.kind));
    const d = roundedPath(pts);
    g.innerHTML = `<path class="hit" d="${d}"/><path class="line" d="${d}"/>` +
      `<circle class="port" cx="${pts[0].x}" cy="${pts[0].y}" r="2.6"/><path class="arrow" d="${arrowHead(pts)}"/>`;
    gEdges.appendChild(g);
    const line = g.querySelector('.line');
    const len = line.getTotalLength();
    const n = e.diff === 'removed' ? 0
      : hasTraffic ? (e.stats ? Math.max(1, Math.min(4, Math.round(Math.log10(e.stats.count + 1) + 0.5))) : 0) : 1;
    for (let i = 0; i < n; i++) {
      const c = document.createElementNS(SVGNS, 'circle');
      c.setAttribute('class', 'pt'); c.setAttribute('r', e.async ? 2.1 : 2.4);
      g.appendChild(c);
      particles.push({ el: c, line, len, t: (i / n + (hashStr(e.id) % 100) / 100) % 1, v: e.async ? 42 : 68 });
    }
    g.addEventListener('mouseenter', (ev) => { state.hover = { type: 'edge', id: e.id }; showEdgeTip(e, ev); applyFocus(); });
    g.addEventListener('mousemove', (ev) => moveTip(ev));
    g.addEventListener('mouseleave', () => { state.hover = null; hideTip(); applyFocus(); });
    g.addEventListener('click', (ev) => { ev.stopPropagation(); select({ type: 'edge', id: e.id }); });
  }

  for (const n of L.nodes) {
    const p = L.pos.get(n.id);
    if (!p) continue;
    const el = document.createElement('div');
    el.className = 'node' + (hasCode && n.discovered && !isDiff ? ' discovered' : '') + (isDiff && n.diff ? ` d-${n.diff}` : '');
    if (isDiff && n.diff) el.dataset.diff = n.diff;
    el.dataset.id = n.id;
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;--k:${kindVar(n.kind)}`;
    const vol = nodeVolume(n.id);
    const sev = worstSeverity(findingsFor('node', n.id).filter(f => f.severity !== 'info'));
    el.innerHTML = `<div class="ic">${ICONS[n.kind] || ICONS.service}</div>` +

// ---------- focus / highlight ----------
function focusSet() {

  }
  if (state.flow) {
    const f = flowById.get(state.flow);

    const nodes = new Set(f.entry ? [f.entry.node] : []);
    for (const id of edges) { const e = edgeById.get(id); if (e) { nodes.add(e.source); nodes.add(e.target); } }
    return { nodes, edges };
  }
  if (state.finding) {

    for (const id of edges) { const e = edgeById.get(id); if (e) { nodes.add(e.source); nodes.add(e.target); } }
    return { nodes, edges };

  if (state.search && state.matches.length) return { nodes: new Set(state.matches), edges: new Set(), search: true };
  const ref = state.hover || state.sel;
  if (!ref) return null;

    const nodes = new Set([ref.id]), edges = new Set();
    for (const e of [...(inEdges.get(ref.id) || []), ...(outEdges.get(ref.id) || [])]) { edges.add(e.id); nodes.add(e.source); nodes.add(e.target); }

}

// ---------- pan / zoom ----------
const canvas = $('canvas'), world = $('world');
function setView(v, animate = false) {

  $('z-pct').textContent = Math.round(v.k * 100) + '%';
}
function zoomAt(factor, cx, cy) {
  const v = state.view, k = Math.max(0.15, Math.min(2.5, v.k * factor));
  setView({ k, x: cx - (cx - v.x) * (k / v.k), y: cy - (cy - v.y) * (k / v.k) });

  setView({ k, x: r.width / 2 - (box.x + box.w / 2) * k, y: (r.height + 40) / 2 - (box.y + box.h / 2) * k }, animate);
}

  const maxX = Math.max(...ps.map(p => p.x + p.w)), maxY = Math.max(...ps.map(p => p.y + p.h));

let drag = null;
canvas.addEventListener('pointerdown', (e) => {

    const errRate = DATA.meta.requests ? DATA.meta.errors / DATA.meta.requests : 0;
    h += `<div class="stats"><div class="stat"><div class="v">${fmt(DATA.meta.requests)}</div><div class="l">Requests</div></div>` +
      `<div class="stat"><div class="v" style="color:${healthColor(errRate)}">${pct(errRate)}</div><div class="l">Error rate</div></div>` +
      `<div class="stat"><div class="v" style="${hotFindings ? 'color:var(--bad)' : ''}">${hotFindings}</div><div class="l">High findings</div></div></div>`;
  }
  h += `<h3>Legend</h3>`;
  for (const k of kinds) {
    h += `<div class="legend-row${state.hiddenKinds.has(k) ? ' off' : ''}" data-kind="${k}" style="--k:${kindVar(k)}"><span class="dot"></span><span class="name">${KIND_LABEL[k]}</span><span class="n">${counts.get(k)}</span></div>`;
  }
  h += `<div style="margin-top:14px">`;
  h += `<div class="line-row">${lineSvg('0')}<span>Sync</span><span class="desc">request / response</span></div>`;
  if (anyAsync) h += `<div class="line-row">${lineSvg('5 4')}<span>Async</span><span class="desc">queues, events</span></div>`;
  if (isDiff) {
    h += `<div class="line-row">${lineSvg('0', 'var(--ok)')}<span>Added</span><span class="desc">new in ${esc(DATA.meta.diff.head.label)}</span></div>`;
    h += `<div class="line-row">${lineSvg('4 4', 'var(--bad)')}<span>Removed</span><span class="desc">gone since ${esc(DATA.meta.diff.base.label)}</span></div>`;
    h += `<div class="line-row">${lineSvg('0', 'var(--warn)')}<span>Changed</span><span class="desc">routes or health</span></div>`;
  }
  if (hasTraffic && !isDiff) {
    if (anyTrafficOnly) h += `<div class="line-row">${lineSvg('1.5 3.5')}<span>Traffic only</span><span class="desc">not found in code</span></div>`;
    if (hasCode) h += `<div class="line-row">${lineSvg('0', 'var(--edge-hi)', .4)}<span>Not observed</span><span class="desc">code only</span></div>`;
    h += `<div class="line-row">${lineSvg('0', 'var(--ok)')}${lineSvg('0', 'var(--warn)')}${lineSvg('0', 'var(--bad)')}<span class="desc">&lt;1% · 1–5% · ≥5% errors</span></div>`;
  }
  h += `</div>`;
  if (DATA.notes?.length) h += `<h3>Notes</h3>` + DATA.notes.map(n => `<div class="note">${esc(n)}</div>`).join('');
  h += `<div class="hint-text">Select a card or line to see its details and routes. Press <kbd>/</kbd> to search, <kbd>Esc</kbd> to clear.` +
    (DATA.flows.length ? ` Open <b>Flows</b> to trace a request end to end.` : '') + `</div>`;
  return h;
}

function callRow(c, showLocs = true) {
  const s = c.stats;
  const meta = [];
  if (s) meta.push(`${fmt(s.count)} req`, `<span style="color:${healthColor(s.error_rate)}">${pct(s.error_rate)} err</span>`, `p95 ${ms(s.p95)}`);
  if (s?.per_request) meta.push(`<span style="color:${s.per_request.max >= 5 ? 'var(--warn)' : 'inherit'}">up to ${s.per_request.max}× per request</span>`);
  else if (c.loop) meta.push(`<span style="color:var(--warn)">in a loop${typeof c.loop === 'string' ? ` (per ${esc(c.loop)})` : ''}</span>`);
  if (c.auth) meta.push(`auth: ${esc(c.auth)}`);
  if (c.timeout === 'none' || c.timeout === false) meta.push('<span style="color:var(--warn)">no timeout</span>');
  else if (typeof c.timeout === 'number') meta.push(`timeout ${ms(c.timeout)}`);
  if (s?.auth) meta.push('sent: ' + Object.entries(s.auth).map(([k, v]) => `${esc(k)} ${fmt(v)}`).join(', '));
  const chip = isDiff && c.diff ? diffChip(c.diff) : observedChip(c.observed);
  return `<div class="row static"${c.diff === 'removed' ? ' style="opacity:.6"' : ''}><div class="row-top">${methodChip(c.method)}<span class="path" title="${esc(callText(c))}">${esc(callText(c))}</span><span class="r">${chip}</span></div>` +
    (meta.length ? `<div class="meta2">${meta.join('<span>·</span>')}</div>` : '') +
    (c.url ? `<div class="locs">${esc(c.url)}</div>` : '') +
    (showLocs && c.locations?.length ? `<div class="locs">${c.locations.map(esc).join('<br>')}</div>` : '') + `</div>`;
}

function edgeRow(e, dir) {
  const other = dir === 'in' ? e.source : e.target;
  const n = nodeById.get(other);
  return `<div class="row" data-edge="${esc(e.id)}"><div class="row-top"><span class="kdot" style="--k:${kindVar(n?.kind)}"></span><span>${esc(label(other))}</span>` +
    `<span class="r">${esc(PROTO_LABEL[e.protocol] || e.protocol)}${e.async ? ' · async' : ''} · ${e.calls?.length || 0} route${e.calls?.length === 1 ? '' : 's'}${e.stats ? ' · ' + fmt(e.stats.count) : ''}</span></div></div>`;
}

function findingCard(f, active = false) {
  const items = f.items || [];
  return `<div class="row finding${active ? ' active' : ''}" data-finding="${esc(f.id)}"${f.diff === 'resolved' ? ' style="opacity:.6"' : ''}><div class="row-top"><span class="sev" style="--sc:${SEV_COLOR[f.severity]}">${f.severity}</span><span class="muted" style="font-size:12px">${esc(f.category)}</span>${f.diff ? `<span class="r">${diffChip(f.diff)}</span>` : ''}</div>` +
    `<div class="ttl">${esc(f.title)}</div><div class="det">${esc(f.detail)}</div>` +
    (items.length ? `<ul>${items.slice(0, active ? 50 : 4).map(i => `<li>${esc(i)}</li>`).join('')}${!active && items.length > 4 ? `<li class="muted">+${items.length - 4} more</li>` : ''}</ul>` : '') + `</div>`;
}

function nodePanel(n) {
  if (!n) return overviewPanel();
  const ins = inEdges.get(n.id) || [], outs = outEdges.get(n.id) || [];
  const fs = findingsFor('node', n.id);
  let h = `<button class="back" data-back>← ${backLabel()}</button><div class="eyebrow" style="color:${kindVar(n.kind)}">${KIND_LABEL[n.kind] || n.kind}</div><h2>${esc(n.label)}</h2>`;
  if (n.tech) h += `<div class="sub">${esc(n.tech)}</div>`;
  if (n.description) h += `<div class="sub">${esc(n.description)}</div>`;
  const chips = [];
  if (n.exposure) chips.push(`<span class="chip ${n.exposure === 'public' ? 'warn' : ''}">${esc(n.exposure)}</span>`);
  if (hasCode && n.discovered && !isDiff) chips.push(`<span class="chip warn">discovered in traffic</span>`);
  if (isDiff && n.diff) chips.push(diffChip(n.diff));
  if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
  if (ins.length) {
    const dependents = blastRadius(n.id).nodes.size - 1;
    h += `<div style="margin-top:14px"><button class="action" data-blast="${esc(n.id)}">◎ Blast radius <span class="muted">${dependents} dependent${dependents === 1 ? '' : 's'}</span></button></div>`;
  }
  const kv = [];
  if (n.location) kv.push(['Location', `<span class="mono" style="font-size:12px">${esc(n.location)}</span>`]);
  if (n.repo) kv.push(['Repo', esc(n.repo)]);
  if (n.aliases?.length) kv.push(['Aliases', `<span class="mono" style="font-size:12px">${n.aliases.map(esc).join(', ')}</span>`]);
  if (kv.length) h += `<dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  const inVol = ins.reduce((s, e) => s + (e.stats?.count || 0), 0), outVol = outs.reduce((s, e) => s + (e.stats?.count || 0), 0);
  const inErr = ins.reduce((s, e) => s + (e.stats?.errors || 0), 0);
  if (hasTraffic && (inVol || outVol)) {
    h += `<div class="stats"><div class="stat"><div class="v">${fmt(inVol)}</div><div class="l">Inbound</div></div><div class="stat"><div class="v">${fmt(outVol)}</div><div class="l">Outbound</div></div>` +
      `<div class="stat"><div class="v" style="color:${healthColor(inVol ? inErr / inVol : 0)}">${pct(inVol ? inErr / inVol : 0)}</div><div class="l">Errors in</div></div></div>`;
  }
  if (fs.length) h += `<h3>Findings <span class="n">${fs.length}</span></h3><div class="list">${fs.map(f => findingCard(f)).join('')}</div>`;
  if (n.endpoints?.length) {
    h += `<h3>Routes served <span class="n">${n.endpoints.length}</span></h3><div class="list">`;
    for (const ep of n.endpoints) {
      let hits = 0, callers = new Set();
      for (const e of ins) for (const c of e.calls || []) {
        if (methodOk(ep.method, c.method) && routeMatch(ep.path, c.path)) { callers.add(e.source); hits += c.stats?.count || 0; }
      }
      const meta = [`${callers.size} caller${callers.size === 1 ? '' : 's'}`];
      if (hits) meta.push(`${fmt(hits)} req`);
      if (ep.auth) meta.push(`auth: ${esc(ep.auth)}`);
      h += `<div class="row static"><div class="row-top">${methodChip(ep.method)}<span class="path">${esc(ep.path || '/')}${ep.operation ? ' · ' + esc(ep.operation) : ''}</span>${!callers.size ? '<span class="r"><span class="chip">unused</span></span>' : ''}</div>` +
        `<div class="meta2">${meta.join('<span>·</span>')}</div>${ep.location ? `<div class="locs">${esc(ep.location)}</div>` : ''}</div>`;
    }
    h += `</div>`;
  }
  if (ins.length) h += `<h3>Called by <span class="n">${ins.length}</span></h3><div class="list">${ins.map(e => edgeRow(e, 'in')).join('')}</div>`;
  if (outs.length) h += `<h3>Calls <span class="n">${outs.length}</span></h3><div class="list">${outs.map(e => edgeRow(e, 'out')).join('')}</div>`;
  return h;
}

function edgePanel(e) {
  if (!e) return overviewPanel();
  const fs = findingsFor('edge', e.id);
  let h = `<button class="back" data-back>← ${backLabel()}</button><div class="eyebrow">Connection</div>` +
    `<h2><a data-node="${esc(e.source)}">${esc(label(e.source))}</a> <span class="arrow">→</span> <a data-node="${esc(e.target)}">${esc(label(e.target))}</a></h2>`;
  const chips = [`<span class="chip">${esc(PROTO_LABEL[e.protocol] || e.protocol)}</span>`, `<span class="chip">${e.async ? 'async' : 'sync'}</span>`];
  if (hasTraffic) chips.push(observedChip(e.observed));
  if (e.confidence === 'inferred') chips.push(`<span class="chip warn">inferred</span>`);
  h += `<div class="chips">${chips.join('')}</div>`;
  if (e.description) h += `<div class="sub" style="margin-top:12px">${esc(e.description)}</div>`;
  if (e.stats) {
    h += `<div class="stats"><div class="stat"><div class="v">${fmt(e.stats.count)}</div><div class="l">Requests</div></div>` +
      `<div class="stat"><div class="v" style="color:${healthColor(e.stats.error_rate)}">${pct(e.stats.error_rate)}</div><div class="l">Errors</div></div>` +
      `<div class="stat"><div class="v">${ms(e.stats.p50)}</div><div class="l">p50</div></div><div class="stat"><div class="v">${ms(e.stats.p95)}</div><div class="l">p95</div></div></div>`;
  }
  if (fs.length) h += `<h3>Findings <span class="n">${fs.length}</span></h3><div class="list">${fs.map(f => findingCard(f)).join('')}</div>`;
  const calls = (e.calls || []).slice().sort((a, b) => (b.stats?.count || 0) - (a.stats?.count || 0));
  h += `<h3>Routes <span class="n">${calls.length}</span></h3>`;
  h += calls.length ? `<div class="list">${calls.map(c => callRow(c)).join('')}</div>` : `<div class="muted" style="font-size:13px">No individual routes recorded.</div>`;
  return h;
}

function flowsPanel() {
  let h = `<div class="eyebrow">Request flows</div><h2>Trace a request</h2><div class="sub">Pick an entry point to highlight every hop it makes through the system.</div>`;
  if (!DATA.flows.length) return h + `<div class="hint-text">No flows were recorded. Flows come from the code scan (key user journeys) or are reconstructed from distributed traces.</div>`;
  h += `<div class="list" style="margin-top:18px">`;
  for (const f of DATA.flows) {
    const active = state.flow === f.id;
    const meta = [`${f.steps.length} hop${f.steps.length === 1 ? '' : 's'}`];
    if (f.stats?.count) meta.push(`${fmt(f.stats.count)} traces`);
    if (f.stats?.errors) meta.push(`<span style="color:var(--bad)">${fmt(f.stats.errors)} with errors</span>`);
    if (f.stats?.calls_per_request) meta.push(`~${f.stats.calls_per_request} calls/request`);
    h += `<div class="row${active ? ' active' : ''}" data-flow="${esc(f.id)}"><div class="row-top"><span style="font-weight:600;font-size:13.5px">${esc(f.name || f.id)}</span><span class="r">${observedChip(f.observed)}</span></div>`;
    if (f.entry) h += `<div class="row-top" style="margin-top:6px">${methodChip(f.entry.method)}<span class="path">${esc(f.entry.path || '')}</span><span class="r">${esc(label(f.entry.node))}</span></div>`;
    if (f.description) h += `<div class="meta2">${esc(f.description)}</div>`;
    h += `<div class="meta2">${meta.join('<span>·</span>')}</div>`;
    if (active && f.samples?.length) {
      const i = Math.min(state.sample, f.samples.length - 1);
      h += `<div class="samples">${f.samples.map((s, j) => `<button class="fbtn${j === i ? ' on' : ''}" data-sample="${j}"${s.error ? ' style="color:var(--bad)"' : ''}>${esc(s.label)} · ${ms(s.duration)}</button>`).join('')}</div>`;
      h += waterfall(f.samples[i]);
    } else if (active) {
      h += `<div class="steps">${f.steps.map(id => { const e = edgeById.get(id); return e ? `<div class="step" data-edge="${esc(id)}"><span>${esc(label(e.source))}</span><span class="arrow">→</span><span>${esc(label(e.target))}</span>${e.async ? '<span class="muted" style="font-size:11.5px">async</span>' : ''}</div>` : ''; }).join('')}</div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

function findingsPanel() {
  const cats = ['all', ...['security', 'contract', 'health', 'structure'].filter(c => DATA.findings.some(f => f.category === c))];
  let h = `<div class="eyebrow">Analysis</div><h2>Findings</h2><div class="sub">Security, contract, health and structure checks across every connection.</div>`;
  if (!DATA.findings.length) return h + `<div class="hint-text">Nothing flagged.</div>`;
  h += `<div class="filters">${cats.map(c => `<button class="fbtn${state.findingFilter === c ? ' on' : ''}" data-ffilter="${c}">${c[0].toUpperCase() + c.slice(1)} <span class="muted">${c === 'all' ? DATA.findings.length : DATA.findings.filter(f => f.category === c).length}</span></button>`).join('')}</div>`;
  const list = DATA.findings.filter(f => state.findingFilter === 'all' || f.category === state.findingFilter);
  return h + `<div class="list">${list.map(f => findingCard(f, state.finding === f.id)).join('')}</div>`;
}

panel.addEventListener('click', (ev) => {
  const t = ev.target;
  if (t.closest('[data-back]')) { state.sel = null; renderPanel(); applyFocus(); return; }
  const kind = t.closest('[data-kind]');
  if (kind) { toggleKind(kind.dataset.kind); return; }
  const blast = t.closest('[data-blast]');
  if (blast) {
    state.blast = blast.dataset.blast; state.sel = null; state.flow = null; state.finding = null;
    applyFocus(); renderPanel(); zoomToNodes(focusIds(), 1);
    return;
  }
  const sample = t.closest('[data-sample]');
  if (sample) { state.sample = Number(sample.dataset.sample); renderPanel(); return; }
  const nodeLink = t.closest('[data-node]');
  if (nodeLink) { select({ type: 'node', id: nodeLink.dataset.node }); zoomToNodes([nodeLink.dataset.node], 1); return; }
  const edgeRef = t.closest('[data-edge]');
  if (edgeRef) {
    const e = edgeById.get(edgeRef.dataset.edge);
    // a step inside an open flow just zooms to that hop and keeps the flow highlighted
    if (!t.closest('[data-flow]')) select({ type: 'edge', id: e.id });
    zoomToNodes([e.source, e.target], 1);
    return;
  }
  const flow = t.closest('[data-flow]');
  if (flow) {
    state.flow = state.flow === flow.dataset.flow ? null : flow.dataset.flow;
    state.sample = 0; state.wfEdge = null;
    applyFocus(); renderPanel();
    if (state.flow) { const fs = focusSet(); zoomToNodes([...fs.nodes], 1); }
    return;
  }
  const ff = t.closest('[data-ffilter]');
  if (ff) { state.findingFilter = ff.dataset.ffilter; renderPanel(); return; }
  const finding = t.closest('[data-finding]');
  if (finding) {
    if (state.tab !== 'findings') { setTab('findings'); }
    state.finding = state.finding === finding.dataset.finding ? null : finding.dataset.finding;
    state.sel = null; applyFocus(); renderPanel();
    if (state.finding) { const fs = focusSet(); zoomToNodes([...fs.nodes], 1); }
  }
});

// ---------- filters ----------
const pop = $('filter-pop');
function renderFilter() {
  const kinds = KIND_ORDER.filter(k => DATA.nodes.some(n => n.kind === k));
  const protos = [...new Set(DATA.edges.map(e => e.protocol))];
  let h = `<h4>Node types</h4>` + kinds.map(k => `<label class="check"><input type="checkbox" data-fk="${k}" ${state.hiddenKinds.has(k) ? '' : 'checked'}><span class="kdot" style="--k:${kindVar(k)}"></span>${KIND_LABEL[k]}<span class="n">${DATA.nodes.filter(n => n.kind === k).length}</span></label>`).join('');
  h += `<h4 style="margin-top:14px">Protocols</h4>` + protos.map(p => `<label class="check"><input type="checkbox" data-fp="${p}" ${state.hiddenProtocols.has(p) ? '' : 'checked'}>${PROTO_LABEL[p] || p}<span class="n">${DATA.edges.filter(e => e.protocol === p).length}</span></label>`).join('');
  if (hasTraffic) h += `<h4 style="margin-top:14px">Traffic</h4><label class="check"><input type="checkbox" data-fu ${state.hideUnobserved ? 'checked' : ''}>Hide connections never observed</label>`;
  pop.innerHTML = h;
}
function closePopover() { pop.classList.remove('open'); $('tb-filter').classList.remove('on'); }
$('tb-filter').onclick = (e) => { e.stopPropagation(); const open = !pop.classList.contains('open'); renderFilter(); pop.classList.toggle('open', open); $('tb-filter').classList.toggle('on', open); };
pop.addEventListener('pointerdown', (e) => e.stopPropagation());
pop.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.fk) { t.checked ? state.hiddenKinds.delete(t.dataset.fk) : state.hiddenKinds.add(t.dataset.fk); }
  else if (t.dataset.fp) { t.checked ? state.hiddenProtocols.delete(t.dataset.fp) : state.hiddenProtocols.add(t.dataset.fp); }
  else if ('fu' in t.dataset) state.hideUnobserved = t.checked;
  relayout(true);
});
function toggleKind(k) { state.hiddenKinds.has(k) ? state.hiddenKinds.delete(k) : state.hiddenKinds.add(k); relayout(true); if (!state.sel) renderPanel(); }

// ---------- search ----------
const search = $('search');
function openSearch() { $('search-box').classList.add('open'); $('tb-search').classList.add('on'); search.focus(); search.select(); }
function closeSearch() { $('search-box').classList.remove('open'); $('tb-search').classList.remove('on'); search.value = ''; runSearch(''); search.blur(); }
$('tb-search').onclick = () => ($('search-box').classList.contains('open') ? closeSearch() : openSearch());
function runSearch(q) {
  state.search = q.trim().toLowerCase();
  state.matches = !state.search ? [] : DATA.nodes.filter(n => state.layout?.pos.has(n.id) && [n.id, n.label, n.tech, n.kind, ...(n.aliases || []), ...(n.endpoints || []).map(ep => ep.path)]
    .some(v => String(v || '').toLowerCase().includes(state.search))).map(n => n.id);
  state.matchIdx = -1;
  $('search-count').textContent = state.search ? `${state.matches.length}` : '';
  applyFocus();
}
search.addEventListener('input', () => runSearch(search.value));
search.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && state.matches.length) {
    state.matchIdx = (state.matchIdx + 1) % state.matches.length;
    const id = state.matches[state.matchIdx];
    state.sel = { type: 'node', id }; renderPanel(); applyFocus(); zoomToNodes([id], 1.1);
  }
  if (e.key === 'Escape') closeSearch();
  e.stopPropagation();
});

// ---------- keyboard ----------
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); }
  else if (e.key === 'Escape') { closePopover(); if (state.search) closeSearch(); clearSelection(); }
  else if (e.key === 'f') fitAll();
  else if (e.key === 'p') { state.playing = !state.playing; syncPlay(); }
  else if (e.key === '+' || e.key === '=') $('z-in').click();
  else if (e.key === '-') $('z-out').click();
});

// ---------- waterfall hover → highlight that hop on the map ----------
panel.addEventListener('mouseover', (ev) => {
  const row = ev.target.closest('.wf-row[data-edge]');
  const id = row ? row.dataset.edge : null;
  if (id !== state.wfEdge) { state.wfEdge = id; applyFocus(); }
});
panel.addEventListener('mouseleave', () => { if (state.wfEdge) { state.wfEdge = null; applyFocus(); } });

// ---------- live mode (served by serve.mjs) ----------
let ticking = false;
function startTicking() { if (!ticking) { ticking = true; requestAnimationFrame(tick); } }

function applyLiveData(next) {
  const before = new Map(DATA.edges.map(e => [e.id, e.stats?.count || 0]));
  DATA = normalize(next);
  indexData();
  // drop selections that no longer exist
  if (state.sel && !(state.sel.type === 'node' ? nodeById : edgeById).has(state.sel.id)) state.sel = null;
  if (state.flow && !flowById.has(state.flow)) state.flow = null;
  if (state.finding && !findingById.has(state.finding)) state.finding = null;
  if (state.blast && !nodeById.has(state.blast)) state.blast = null;
  renderHeader();
  canvas.querySelector('.empty')?.remove();
  relayout(true, true).then(() => {
    if (state.layout && before.size === 0) fitAll(false);
    // pulse every connection that received new requests
    for (const e of DATA.edges) {
      if ((e.stats?.count || 0) <= (before.get(e.id) || 0)) continue;
      const el = document.querySelector(`.edge[data-id="${CSS.escape(e.id)}"]`);
      if (!el) continue;
      el.classList.remove('pulse'); void el.getBoundingClientRect(); el.classList.add('pulse');
    }
    renderPanel();
    startTicking();
  });
}

function connectLive() {
  const source = new EventSource('events');
  source.addEventListener('graph', (ev) => {
    try { applyLiveData(JSON.parse(ev.data)); } catch (err) { console.error('live update failed', err); }
  });
}

// ---------- boot ----------
async function relayout(keepView = false, quiet = false) {
  if (!elk) { $('loading').textContent = 'Layout engine failed to load (offline and no vendored ELK).'; return; }
  if (!quiet) $('loading').style.display = 'grid';
  try {
    state.layout = await computeLayout();
  } catch (err) {
    $('loading').textContent = 'Layout failed: ' + err.message;
    console.error(err);
    return;
  }
  $('loading').style.display = 'none';
  draw();
  placeParticlesOnce();
  if (!keepView) fitAll(false);
  if (state.search) runSearch(state.search);
}

syncPlay();
readHash();
renderPanel();
if (!DATA.nodes.length) {
  $('loading').style.display = 'none';
  canvas.insertAdjacentHTML('beforeend', '<div class="empty">No nodes in this graph.</div>');
} else {
  relayout().then(() => {
    const ids = focusIds();
    if (ids.length && (state.sel || state.flow || state.finding || state.blast)) zoomToNodes(ids, 1, false);
    startTicking();
  });
}
if (isLive) connectLive();
window.addEventListener('resize', () => { if (state.layout) fitAll(false); });
})();
</script>
</body>
</html>
